syntax = "proto3";

package g1;

message Pos {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
}

message Euler {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
}

message pnc_msg {
  float time = 1;
  uint32 phase = 2;

  repeated float est_base_joint_pos = 3;
  repeated float est_base_joint_ori = 4;

  repeated float joint_positions = 5;

  repeated float des_com_pos = 6;
  repeated float act_com_pos = 7;

  repeated float lfoot_pos = 8;
  repeated float rfoot_pos = 9;

  repeated float lfoot_ori = 10;
  repeated float rfoot_ori = 11;

  repeated float lfoot_rf_cmd = 12;
  repeated float rfoot_rf_cmd = 13;

  repeated float est_icp = 14;
  repeated float des_icp = 15;

  repeated float des_cmp = 16;

  repeated float com_xy_weight = 17;
  repeated float com_xy_kp = 18;
  repeated float com_xy_kd = 19;
  repeated float com_xy_ki = 20;

  float com_z_weight = 21;
  float com_z_kp = 22;
  float com_z_kd = 23;

  repeated float torso_ori_weight = 24;
  repeated float torso_ori_kp = 25;
  repeated float torso_ori_kd = 26;

  repeated float lf_pos_weight = 27;
  repeated float lf_pos_kp = 28;
  repeated float lf_pos_kd = 29;

  repeated float rf_pos_weight = 30;
  repeated float rf_pos_kp = 31;
  repeated float rf_pos_kd = 32;

  repeated float lf_ori_weight = 33;
  repeated float lf_ori_kp = 34;
  repeated float lf_ori_kd = 35;

  repeated float rf_ori_weight = 36;
  repeated float rf_ori_kp = 37;
  repeated float rf_ori_kd = 38;

  repeated float kf_base_joint_pos = 39;
  repeated float kf_base_joint_ori = 40;

  float lfoot_rf_normal = 41;
  float rfoot_rf_normal = 42;
  float lfoot_rf_normal_filt = 43;
  float rfoot_rf_normal_filt = 44;
  float lfoot_volt_normal_raw = 45;
  float rfoot_volt_normal_raw = 46;
  bool b_lfoot = 47;
  bool b_rfoot = 48;

  repeated float quat_world_local = 49;

  // mpc msg
  repeated Pos des_com_traj = 50;
  repeated Euler des_torso_ori_traj = 51;
  repeated Pos des_lf_pos_traj = 52;
  repeated Pos des_rf_pos_traj = 53;
  repeated Euler des_lf_ori_traj = 54;
  repeated Euler des_rf_ori_traj = 55;

  repeated float joint_pos_des = 56;
  repeated float joint_vel_des = 57;
  repeated float joint_trq_des = 58;
  repeated float joint_velocities = 59;

  // mpc costs
  uint32 total_iterations = 60;
  repeated float xreg_costs = 61;
  repeated float ureg_costs = 62;
  repeated float xbound_costs = 63;
  repeated float com_costs = 64;

  // mpc frame tracking
  Pos torso_des_pos = 65;
  Pos left_ankle_roll_des_pos = 66;
  Pos right_ankle_roll_des_pos = 67;
  Pos left_knee_des_pos = 68;
  Pos right_knee_des_pos = 69;
  Pos left_rubber_hand_des_pos = 70;
  Pos right_rubber_hand_des_pos = 71;

  //mpc frame costs
  repeated float left_hand_frame_costs = 72;
  repeated float right_hand_frame_costs = 73;
  repeated float left_ankle_frame_costs = 74;
  repeated float right_ankle_frame_costs = 75;
  repeated float left_knee_frame_costs = 76;
  repeated float right_knee_frame_costs = 77;
  repeated float torso_link_frame_costs = 78;

  // mpc contact costs
  repeated float left_hand_contact_costs = 79;
  repeated float right_hand_contact_costs = 80;
  repeated float left_foot_contact_costs = 81;
  repeated float right_foot_contact_costs = 82;

  // current pos
  Pos torso_curr_pos = 83;
  Pos left_ankle_roll_curr_pos = 84;
  Pos right_ankle_roll_curr_pos = 85;
  Pos left_knee_curr_pos = 86;
  Pos right_knee_curr_pos = 87;
  Pos left_rubber_hand_curr_pos = 88;
  Pos right_rubber_hand_curr_pos = 89;
  Pos com_curr_pos = 90;

  Pos com_des_pos = 91;

  repeated Pos l_foot_rf = 92;
  repeated Pos r_foot_rf = 93;
  repeated Pos l_hand_rf = 94;
  repeated Pos r_hand_rf = 95;

  repeated float lhand_pos = 96;
  repeated float rhand_pos = 97;

  repeated float lhand_ori = 98;
  repeated float rhand_ori = 99;

}

message rs_teleop_msg {
  repeated float pos = 1;
  repeated float quat = 2;
  bool b_grasp = 3;
  bool b_teleop_toggled = 4;
}

message vr_teleop_msg {
  repeated float lh_pos = 1;
  repeated float rh_pos = 2;
  repeated float lh_ori = 3;
  repeated float rh_ori = 4;

  bool l_trigger = 5;
  bool l_bump = 6;
  bool l_button = 7;
  bool l_pad = 8;

  bool r_trigger = 9;
  bool r_bump = 10;
  bool r_button = 11;
  bool r_pad = 12;

  int64 vr_timestamp = 13;
}
